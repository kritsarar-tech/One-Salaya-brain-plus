<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Salaya Brain Plus (Cloud Sync)</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      text-align: center;
      color: #0f172a;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary-color);
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      margin-top: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.8;
    }

    .list-header {
      margin-top: 32px;
      margin-bottom: 12px;
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .data-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .data-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f1f5f9;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .data-item-content {
      flex-grow: 1;
      margin-right: 12px;
    }

    .data-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 2px;
    }

    .data-sub {
      font-size: 0.85rem;
      color: #64748b;
    }

    .btn-delete {
      background-color: transparent;
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .btn-delete:hover:not(:disabled) {
      background-color: var(--danger-color);
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: #94a3b8;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>One Salaya Brain Plus</h2>

    <!-- ฟอร์มบันทึกข้อมูล -->
    <form id="data-form">
      <div class="form-group">
        <label for="title-input">หัวข้อ / ชื่อข้อมูล</label>
        <input type="text" id="title-input" placeholder="พิมพ์ชื่อข้อมูลที่ต้องการบันทึก..." required>
      </div>

      <div class="form-group">
        <label for="desc-input">รายละเอียดเพิ่มเติม (ถ้ามี)</label>
        <textarea id="desc-input" rows="3" placeholder="ระบุรายละเอียด..."></textarea>
      </div>

      <button type="submit" id="save-btn" class="btn btn-primary">บันทึกข้อมูล</button>
    </form>

    <!-- รายการข้อมูลที่บันทึกแล้ว -->
    <div class="list-header">
      <span>รายการที่บันทึกไว้</span>
      <span id="sync-status" style="font-size: 0.8rem; color: #64748b;"></span>
    </div>
    <ul id="data-list" class="data-list"></ul>
  </div>

  <script>
    // ** ใส่ Web App URL ของ Google Apps Script หรือ API Endpoint ของคุณที่นี่ **
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    const dataForm = document.getElementById("data-form");
    const titleInput = document.getElementById("title-input");
    const descInput = document.getElementById("desc-input");
    const saveBtn = document.getElementById("save-btn");
    const dataList = document.getElementById("data-list");
    const syncStatus = document.getElementById("sync-status");

    // โหลดข้อมูลจาก LocalStorage ตอนเปิดหน้าเว็บ
    let items = JSON.parse(localStorage.getItem("salaya_items") || "[]");

    function renderList() {
      dataList.innerHTML = "";

      if (items.length === 0) {
        dataList.innerHTML = `<li class="empty-state">ยังไม่มีข้อมูลที่บันทึก</li>`;
        return;
      }

      items.forEach((item) => {
        const li = document.createElement("li");
        li.className = "data-item";
        li.id = `item-${item.id}`;

        li.innerHTML = `
          <div class="data-item-content">
            <div class="data-title">${escapeHtml(item.title)}</div>
            ${item.desc ? `<div class="data-sub">${escapeHtml(item.desc)}</div>` : ""}
            <div class="data-sub" style="font-size:0.75rem; color:#94a3b8; margin-top:2px;">
              ${new Date(item.timestamp).toLocaleString("th-TH")}
            </div>
          </div>
          <button class="btn btn-delete" onclick="handleDelete('${item.id}')">ลบ</button>
        `;
        dataList.appendChild(li);
      });
    }

    // 1. จัดการการบันทึกข้อมูล พร้อมกันการกดย้ำ (Debounce/Disable)
    dataForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = titleInput.value.trim();
      const desc = descInput.value.trim();
      if (!title) return;

      // ป้องกันการกดย้ำทันที
      saveBtn.disabled = true;
      const originalText = saveBtn.innerText;
      saveBtn.innerText = "กำลังบันทึกข้อมูล...";

      const newItem = {
        id: "id_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
        title: title,
        desc: desc,
        timestamp: new Date().toISOString()
      };

      try {
        // อัปเดตฝั่ง Cloud Sync ถ้ามีการตั้ง URL
        if (SCRIPT_URL && SCRIPT_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "save", data: newItem })
          });
        }

        // บันทึกลง Local
        items.unshift(newItem);
        localStorage.setItem("salaya_items", JSON.stringify(items));

        titleInput.value = "";
        descInput.value = "";
        renderList();
      } catch (err) {
        console.error("Save error:", err);
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อคลาวด์");
      } finally {
        // ปลดล็อคปุ่มเสมอ
        saveBtn.disabled = false;
        saveBtn.innerText = originalText;
      }
    });

    // 2. จัดการการลบข้อมูล
    async function handleDelete(id) {
      if (!confirm("ต้องการลบข้อมูลนี้ใช่หรือไม่?")) return;

      const deleteBtn = document.querySelector(`#item-${id} .btn-delete`);
      if (deleteBtn) {
        deleteBtn.disabled = true;
        deleteBtn.innerText = "กำลังลบ...";
      }

      try {
        // แจ้ง Cloud ให้ลบรายการ
        if (SCRIPT_URL && SCRIPT_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "delete", id: id })
          });
        }

        // อัปเดตรายการในเครื่อง
        items = items.filter(item => item.id !== id);
        localStorage.setItem("salaya_items", JSON.stringify(items));
        renderList();
      } catch (err) {
        console.error("Delete error:", err);
        alert("ไม่สามารถลบข้อมูลได้ กรุณาลองใหม่อีกครั้ง");
        if (deleteBtn) {
          deleteBtn.disabled = false;
          deleteBtn.innerText = "ลบ";
        }
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    // เริ่มต้นแสดงผลรายการ
    renderList();
  </script>
</body>
</html>
